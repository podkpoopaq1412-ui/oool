name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project files
        run: |
          set -e
          mkdir -p app/src/main/assets app/src/main/res/xml app/src/main/res/values app/src/main/java/com/example/longestkb
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "LongestWordKeyboard"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.longestkb"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.longestkb"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="@string/app_name"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".LongestWordIME"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_INPUT_METHOD"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data android:name="android.view.im" android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/xml/method.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android"
              android:settingsActivity="com.example.longestkb.MainActivity">
              <subtype
                  android:label="ไทย"
                  android:imeSubtypeLocale="th_TH"
                  android:imeSubtypeMode="keyboard" />
          </input-method>
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">แป้นพิมพ์คำยาวสุด</string>
          </resources>
          EOF
          cat > app/src/main/java/com/example/longestkb/MainActivity.kt <<'EOF'
          package com.example.longestkb

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.view.inputmethod.InputMethodManager
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {
              private lateinit var enabledText: TextView
              private lateinit var selectedText: TextView
              private val imm get() = getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val pad = (20 * resources.displayMetrics.density).toInt()
                  fun label(t: String, size: Float) = TextView(this).apply {
                      text = t; textSize = size; setPadding(0, pad / 2, 0, pad / 4)
                  }
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad * 2, pad, pad)
                  }
                  col.addView(label("แป้นพิมพ์คำยาวสุด", 24f))
                  enabledText = label("", 14f)
                  col.addView(enabledText)
                  col.addView(Button(this).apply {
                      text = "1. เปิดใช้งานแป้นพิมพ์"
                      setOnClickListener { startActivity(Intent(Settings.ACTION_INPUT_METHOD_SETTINGS)) }
                  })
                  selectedText = label("", 14f)
                  col.addView(selectedText)
                  col.addView(Button(this).apply {
                      text = "2. เลือกใช้แป้นพิมพ์นี้"
                      setOnClickListener { imm.showInputMethodPicker() }
                  })
                  col.addView(EditText(this).apply {
                      hint = "3. แตะที่นี่แล้วลองพิมพ์ ตม"; textSize = 18f
                  })
                  setContentView(col)
              }

              override fun onResume() { super.onResume(); refresh() }
              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus); if (hasFocus) refresh()
              }

              private fun refresh() {
                  val enabled = imm.enabledInputMethodList.any { it.packageName == packageName }
                  val current = Settings.Secure.getString(contentResolver, Settings.Secure.DEFAULT_INPUT_METHOD) ?: ""
                  enabledText.text = if (enabled) "✓ เปิดใช้งานแล้ว" else "ยังไม่ได้เปิดใช้งาน"
                  selectedText.text = if (current.startsWith("$packageName/")) "✓ กำลังใช้แป้นพิมพ์นี้" else "ยังไม่ได้เลือกใช้"
              }
          }
          EOF
          cat > app/src/main/java/com/example/longestkb/LongestWordIME.kt <<'EOF'
          package com.example.longestkb

          import android.content.res.ColorStateList
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.graphics.drawable.RippleDrawable
          import android.inputmethodservice.InputMethodService
          import android.os.Handler
          import android.os.Looper
          import android.text.InputType
          import android.view.Gravity
          import android.view.HapticFeedbackConstants
          import android.view.KeyEvent
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup.LayoutParams.MATCH_PARENT
          import android.view.ViewGroup.LayoutParams.WRAP_CONTENT
          import android.view.inputmethod.EditorInfo
          import android.view.inputmethod.InputMethodManager
          import android.widget.FrameLayout
          import android.widget.HorizontalScrollView
          import android.widget.LinearLayout
          import android.widget.TextView

          class LongestWordIME : InputMethodService() {
              private companion object {
                  const val MAX_LEN = 7 // ความยาวคำสูงสุดที่แนะนำ (นับตัวอักษรที่เห็น ไม่นับสระบน/ล่าง วรรณยุกต์)
                  const val MAX_SUFFIX = 10 // ดูตัวอักษรท้ายสุดที่พิมพ์ไม่เกินกี่ตัว
                  val NORMAL = listOf("ๅ/_ภถุึคตจขช", "ๆไำพะัีรนยบลฃ", "ฟหกดเ้่าสวง", "ผปแอิืทมใฝ,.")
                  val SHIFT = listOf("+๑๒๓๔ู฿๕๖๗๘๙", "๐\"ฎฑธํ๊ณฯญฐ,ฅ", "ฤฆฏโฌ็๋ษศซ.", "()ฉฮฺ์?ฒฬฦ!:")
                  val SYM = listOf("1234567890", "@#฿%&-+()/", "*\"':;!?=_~", "[]{}<>^|\\,.")
                  val HINTS = mapOf('ๅ' to "1", '/' to "2", '_' to "3", 'ภ' to "4", 'ถ' to "5",
                      'ค' to "6", 'ต' to "7", 'จ' to "8", 'ข' to "9", 'ช' to "0")
                  val TAIL = Regex("[\\u0E00-\\u0E7F]+$")
                  val COMB = Regex("[\\u0E31\\u0E34-\\u0E3A\\u0E47-\\u0E4E]")
                  val BG = Color.parseColor("#1B2027")
                  val KEY = Color.parseColor("#363A42")
                  val FN = Color.parseColor("#3B4559")
                  val ACC = Color.parseColor("#7F9BE0")
                  val TXT = Color.parseColor("#E8EAF0")
                  val SUB = Color.parseColor("#9AA0AE")
                  val DIV = Color.parseColor("#3A404A")
              }

              @Volatile private var words: List<String> = emptyList()
              private var shift = false
              private var symbols = false
              private var containsMode = true
              private var suppress = false
              private val handler = Handler(Looper.getMainLooper())
              private lateinit var scroller: HorizontalScrollView
              private lateinit var bar: LinearLayout
              private lateinit var keyArea: LinearLayout

              private val wide get() = resources.configuration.screenWidthDp >= 600

              override fun onCreate() {
                  super.onCreate()
                  Thread {
                      val set = HashSet<String>()
                      assets.open("words_th.txt").bufferedReader().useLines { lines ->
                          lines.forEach { l ->
                              val w = l.trim()
                              if (w.length > 1 && w.none { it.isWhitespace() }) set.add(w)
                          }
                      }
                      words = set.filter { vlen(it) <= MAX_LEN }.sortedByDescending { vlen(it) }
                  }.start()
              }

              override fun onCreateInputView(): View {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(BG)
                      setPadding(dp(6), dp(2), dp(6), dp(10))
                  }
                  bar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      minimumHeight = dp(48)
                  }
                  scroller = HorizontalScrollView(this).apply {
                      isHorizontalScrollBarEnabled = false
                      addView(bar)
                  }
                  keyArea = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  root.addView(scroller)
                  root.addView(keyArea)
                  buildKeys()
                  showSuggestions()
                  return root
              }

              override fun onStartInputView(info: EditorInfo, restarting: Boolean) {
                  super.onStartInputView(info, restarting)
                  val cls = info.inputType and InputType.TYPE_MASK_CLASS
                  val v = info.inputType and InputType.TYPE_MASK_VARIATION
                  suppress = cls != InputType.TYPE_CLASS_TEXT ||
                      v == InputType.TYPE_TEXT_VARIATION_PASSWORD ||
                      v == InputType.TYPE_TEXT_VARIATION_VISIBLE_PASSWORD ||
                      v == InputType.TYPE_TEXT_VARIATION_WEB_PASSWORD
                  showSuggestions()
              }

              override fun onUpdateSelection(
                  oldSelStart: Int, oldSelEnd: Int, newSelStart: Int, newSelEnd: Int,
                  candidatesStart: Int, candidatesEnd: Int
              ) {
                  super.onUpdateSelection(oldSelStart, oldSelEnd, newSelStart, newSelEnd, candidatesStart, candidatesEnd)
                  showSuggestions()
              }

              private fun vlen(w: String) = w.replace(COMB, "").length

              // ภาษาไทยไม่มีเว้นวรรค จึงดูแค่ตัวอักษรท้ายสุด: เริ่มจากยาวสุด ถ้าไม่เจอคำก็ลดทีละตัว
              private fun showSuggestions() {
                  if (!::bar.isInitialized) return
                  bar.removeAllViews()
                  bar.addView(modeCell())
                  bar.addView(divider())
                  if (suppress) return
                  val before = currentInputConnection?.getTextBeforeCursor(MAX_SUFFIX, 0)?.toString() ?: return
                  val run = TAIL.find(before)?.value ?: return
                  var k = run.length
                  while (k >= 1) {
                      val s = run.substring(run.length - k)
                      if (!COMB.containsMatchIn(s.take(1))) {
                          var n = 0
                          for (w in words) {
                              if (w.length < k || w == s) continue
                              val hit = if (containsMode) w.contains(s) else w.startsWith(s)
                              if (hit) {
                                  bar.addView(cell(w) { pick(s, w) })
                                  bar.addView(divider())
                                  if (++n >= 40) break
                              }
                          }
                          if (n > 0) break
                      }
                      k--
                  }
                  scroller.scrollTo(0, 0)
              }

              private fun pick(typed: String, word: String) {
                  currentInputConnection?.apply {
                      beginBatchEdit()
                      deleteSurroundingText(typed.length, 0)
                      commitText("$word ", 1)
                      endBatchEdit()
                  }
                  showSuggestions()
              }

              private fun typeChar(s: String) {
                  currentInputConnection?.commitText(s, 1)
                  if (shift) { shift = false; buildKeys() }
                  showSuggestions()
              }

              private fun backspace() {
                  val ic = currentInputConnection ?: return
                  if (!ic.getSelectedText(0).isNullOrEmpty()) ic.commitText("", 1) else ic.deleteSurroundingText(1, 0)
                  showSuggestions()
              }
              
              private fun enter() {
                  val ic = currentInputConnection ?: return
                  if (!sendDefaultEditorAction(true)) ic.commitText("\n", 1)
                  showSuggestions()
              }

              // ---- views ----
              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun round(c: Int, r: Int) = GradientDrawable().apply { setColor(c); cornerRadius = dp(r).toFloat() }

              private fun cell(label: String, onTap: () -> Unit) = TextView(this).apply {
                  text = label; textSize = 20f; setTextColor(TXT); gravity = Gravity.CENTER
                  minWidth = resources.displayMetrics.widthPixels / 4
                  setPadding(dp(14), 0, dp(14), 0)
                  layoutParams = LinearLayout.LayoutParams(WRAP_CONTENT, dp(44))
                  setOnClickListener { onTap() }
              }

              private fun modeCell() = TextView(this).apply {
                  text = if (containsMode) "มีในคำ" else "ขึ้นต้น"; textSize = 13f; setTextColor(ACC)
                  gravity = Gravity.CENTER; setPadding(dp(14), 0, dp(14), 0)
                  layoutParams = LinearLayout.LayoutParams(WRAP_CONTENT, dp(44))
                  setOnClickListener { containsMode = !containsMode; showSuggestions() }
              }

              private fun divider() = View(this).apply {
                  setBackgroundColor(DIV)
                  layoutParams = LinearLayout.LayoutParams(dp(1), dp(24))
              }

              private fun spacer(w: Float) = View(this).apply { layoutParams = LinearLayout.LayoutParams(0, 0, w) }

              private fun key(
                  label: String, weight: Float = 1f, fill: Int = KEY, hint: String? = null,
                  size: Float = 22f, onTap: () -> Unit
              ): FrameLayout {
                  val f = FrameLayout(this)
                  val m = dp(if (wide) 3 else 1)
                  f.layoutParams = LinearLayout.LayoutParams(0, dp(if (wide) 54 else 46), weight).apply { setMargins(m, m, m, m) }
                  f.background = RippleDrawable(
                      ColorStateList.valueOf(Color.argb(70, 255, 255, 255)), round(fill, 10), round(Color.WHITE, 10)
                  )
                  f.addView(TextView(this).apply {
                      text = label; textSize = if (wide) size else size * 0.85f
                      setTextColor(TXT); gravity = Gravity.CENTER
                  }, FrameLayout.LayoutParams(MATCH_PARENT, MATCH_PARENT))
                  if (hint != null) {
                      f.addView(TextView(this).apply { text = hint; textSize = 11f; setTextColor(SUB) },
                          FrameLayout.LayoutParams(WRAP_CONTENT, WRAP_CONTENT, Gravity.TOP or Gravity.END).apply {
                              setMargins(0, dp(3), dp(6), 0)
                          })
                      f.setOnLongClickListener { typeChar(hint); true } // กดค้างพิมพ์ตัวเลข เหมือน Gboard
                  }
                  f.setOnClickListener { it.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP); onTap() }
                  return f
              }

              private fun backspaceKey(): FrameLayout {
                  val k = key("⌫", 1.5f, FN, size = 18f) {}
                  val repeat = object : Runnable {
                      override fun run() { backspace(); handler.postDelayed(this, 50) }
                  }
                  k.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> { backspace(); handler.postDelayed(repeat, 400) }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> handler.removeCallbacks(repeat)
                      }
                      true
                  }
                  return k
              }

              private fun buildKeys() {
                  keyArea.removeAllViews()
                  val layout = when { symbols -> SYM; shift -> SHIFT; else -> NORMAL }
                  layout.forEachIndexed { i, chars ->
                      val row = LinearLayout(this)
                      if (i == 3 && !symbols) {
                          row.addView(key("⇧", 1.5f, if (shift) ACC else FN, size = 20f) { shift = !shift; buildKeys() })
                      }
                      for (ch in chars) {
                          val s = ch.toString()
                          val label = if (COMB.containsMatchIn(s)) "\u25CC$s" else s
                          val hint = if (i == 0 && !shift && !symbols) HINTS[ch] else null
                          row.addView(key(label, 1f, KEY, hint) { typeChar(s) })
                      }
                      when (i) {
                          0 -> row.addView(backspaceKey())
                          1 -> if (!symbols) row.addView(spacer(0.5f))
                          2 -> row.addView(key("↵", if (symbols) 1.5f else 2.5f, FN, size = 20f) { enter() })
                      }
                      keyArea.addView(row)
                  }
                  val bottom = LinearLayout(this)
                  bottom.addView(key(if (symbols) "กขค" else "?123", 1.5f, FN, size = 15f) {
                      symbols = !symbols; shift = false; buildKeys()
                  })
                  bottom.addView(key("🌐", 1.5f, FN, size = 18f) {
                      (getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager).showInputMethodPicker()
                  })
                  bottom.addView(key("ไทย", 8.1f, KEY, size = 15f) { typeChar(" ") })
                  bottom.addView(key("◀", 1.2f, FN, size = 14f) { sendDownUpKeyEvents(KeyEvent.KEYCODE_DPAD_LEFT) })
                  bottom.addView(key("▶", 1.2f, FN, size = 14f) { sendDownUpKeyEvents(KeyEvent.KEYCODE_DPAD_RIGHT) })
                  keyArea.addView(bottom)
              }
          }
          EOF
          # รายการคำศัพท์ (ดาวน์โหลดตอน build) + คำของคุณเอง เพิ่มบรรทัด echo ได้ไม่จำกัด
          curl -fsSL https://raw.githubusercontent.com/PyThaiNLP/pythainlp/dev/pythainlp/corpus/words_th.txt -o app/src/main/assets/words_th.txt
          echo "" >> app/src/main/assets/words_th.txt
          echo "อุดมราชนิเวศน์มหาสถาน" >> app/src/main/assets/words_th.txt
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Keyboard APK ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          
